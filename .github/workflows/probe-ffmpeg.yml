name: Probe ffmpeg builds (DXV, HAP)

# Which static ffmpeg builds write DXV and HAP (Resolume), per platform. A one-off check (Alex, 31 Oct: he allowed
# gyan.dev, BtbN, Martin Riedl and evermeet); removed after.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-ffmpeg.yml']

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe
        shell: bash
        run: |
          uname -m
          probe() { echo "=== $1"; mkdir -p "p/$1"; cd "p/$1"; curl -fsSL -m 300 -o f.zip "$2" || { echo "download failed"; cd - >/dev/null; return; }
            unzip -oq f.zip || true; b=$(find . -type f -name ffmpeg | head -1); [ -z "$b" ] && { echo "no binary"; ls; cd - >/dev/null; return; }
            chmod +x "$b"; xattr -c "$b" 2>/dev/null || true; "$b" -hide_banner -version | head -1; "$b" -hide_banner -encoders | grep -Ei ' (dxv|hap|libsvtav1|libaom-av1|h264_videotoolbox|libx265)' ; otool -L "$b" | head -5; ls -la "$b"; cd - >/dev/null; }
          probe riedl-arm "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          probe riedl-intel "https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip"
          probe evermeet "https://evermeet.cx/ffmpeg/getrelease/zip"
  win:
    runs-on: windows-latest
    steps:
      - name: Probe
        shell: bash
        run: |
          probe() { echo "=== $1"; mkdir -p "p/$1"; cd "p/$1"; curl -fsSL -m 300 -o f.zip "$2" || { echo "download failed"; cd - >/dev/null; return; }
            unzip -oq f.zip || 7z x -y f.zip >/dev/null || true; b=$(find . -type f -name ffmpeg.exe | head -1); [ -z "$b" ] && { echo "no binary"; cd - >/dev/null; return; }
            "$b" -hide_banner -version | head -1; "$b" -hide_banner -encoders | grep -Ei ' (dxv|hap|libsvtav1|libaom-av1|libx265)'; ls -la "$b"; cd - >/dev/null; }
          probe gyan-ess "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          probe gyan-full "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-full_build.zip"
          probe btbn-gpl "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip"
